[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "calendar-studio"
version = "0.1.0"
description = "Explicit business calendars, composable rules and reproducible calendar artifacts"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{name = "Jacobo León"}]
dependencies = ["pandas>=2.1,<4", "numpy>=1.26", "pydantic>=2.7,<3", "pyarrow>=17"]

[project.optional-dependencies]
studio = ["streamlit>=1.40,<2"]
dev = ["pytest>=8", "ruff>=0.8", "build>=1.2", "twine>=6", "nbformat>=5.10"]

[project.scripts]
calendar-studio = "calendar_studio.cli:main"

[project.urls]
Repository = "https://github.com/JacoboGGLeon/calendar_studio"

[tool.hatch.build.targets.wheel]
packages = ["src/calendar_studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
